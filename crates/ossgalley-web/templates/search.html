{% extends "layout.html" %}
{% block title %}Search - ossgalley{% endblock %}
{% block content %}
<h1>Search</h1>
<input type="search" name="q" placeholder="Search files..." hx-get="/search" hx-trigger="keyup changed delay:500ms" hx-target="#results">
<div id="results">
    {% for file in results %}
    <div><a href="/files/{{ file.key }}">{{ file.key }}</a></div>
    {% endfor %}
</div>
{% endblock %}
