{% extends "layout.html" %}
{% block title %}Timeline - ossgalley{% endblock %}
{% block content %}
<h1>Timeline</h1>
{% for entry in timeline %}
<h2>{{ entry.date }}</h2>
<div class="gallery-grid">
    {% for file in entry.files %}
    <div><a href="/files/{{ file.key }}">{{ file.key }}</a></div>
    {% endfor %}
</div>
{% endfor %}
{% endblock %}
