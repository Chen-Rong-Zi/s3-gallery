{% extends "layout.html" %}
{% block title %}Gallery - ossgalley{% endblock %}
{% block content %}
<h1>Gallery</h1>
<div id="gallery-container">
    {% for item in items %}
    <div class="gallery-item">
        <a href="/files/{{ item.key }}">
            <img class="thumbnail" src="{{ item.thumbnail_url }}" loading="lazy" alt="{{ item.name }}">
        </a>
        <div class="gallery-item-name">{{ item.name }}</div>
    </div>
    {% endfor %}
    {% if has_more %}
    <div class="gallery-load-more"
         hx-get="/gallery?page={{ page + 1 }}"
         hx-trigger="revealed"
         hx-swap="outerHTML">
        Loading more...
    </div>
    {% endif %}
</div>
{% endblock %}
