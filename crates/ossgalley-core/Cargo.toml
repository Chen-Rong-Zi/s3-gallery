[package]
name = "ossgalley-core"
edition = "2021"
version = "0.1.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
aws-sdk-s3 = "1.138.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
async-trait = "0.1"
futures = "0.3"
kamadak-exif = "0.5"
image = "0.25"
minijinja = "2"

[dev-dependencies]
tempfile = "3"
proptest = "1"