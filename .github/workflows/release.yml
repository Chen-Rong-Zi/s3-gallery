name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p s3-gallery-cli

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: s3-gallery-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/s3-gallery-cli${{ matrix.ext }}

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on master branch
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if git merge-base --is-ancestor "$TAG" origin/master; then
            echo "✅ Tag $TAG is on master branch"
          else
            echo "❌ Tag $TAG is NOT on master branch — aborting release"
            exit 1
          fi

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: s3-gallery-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: s3-gallery-*
          generate_release_notes: true